<!DOCTYPE html>
<!--
  Source for brand/og-image.png (the 1200x630 image shown when the site is shared).
  Open this file in Chrome, set the viewport to 1200x630 (DevTools > device toolbar),
  then use "Capture screenshot" and save it as brand/og-image.png.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,600&display=swap" rel="stylesheet">
<style>
    html, body { margin: 0; }
    .og {
        width: 1200px;
        height: 630px;
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background:
            radial-gradient(900px 480px at 88% -10%, rgba(125, 185, 240, .55), transparent 60%),
            radial-gradient(700px 400px at 6% 10%, rgba(255, 255, 255, .12), transparent 55%),
            linear-gradient(160deg, #062a56 0%, #0b4d94 40%, #2f7fe0 78%, #7db9f0 108%);
    }
    .og img { width: 1000px; margin-top: -6px; }
    .og p, .og small { font-family: 'Archivo', sans-serif; font-stretch: 125%; font-weight: 600; }
    .og p { margin: 30px 0 0; font-size: 26px; line-height: 1; letter-spacing: .6em; padding-left: .6em; color: rgba(255, 255, 255, .88); }
    .og small { position: absolute; bottom: 34px; font-size: 18px; line-height: 1; letter-spacing: .2em; color: rgba(255, 255, 255, .6); }
</style>
</head>
<body>
    <div class="og">
        <img src="../brand/logo-white.svg" alt="">
        <p>IT ENGINEER</p>
        <small>DKEIKICHI.COM</small>
    </div>
</body>
</html>
